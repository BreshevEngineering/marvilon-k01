name: K01 Repository Guard
on:
  push:
  pull_request:
jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository structure guard
        run: python tools/repo/repo_guard.py --ci
