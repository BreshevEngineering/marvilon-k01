name: Legacy diagnostic - engineering-qa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
