name: K01 tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: K01 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Center test dependencies
        run: python -m pip install -r center/requirements-test.txt

      - name: Center import-safety gate
        run: python center/tools/ci/import_safety_guard.py --center-root center

      - name: Full Center test suite and generated acceptance
        run: python center/tools/ci/k01_center_acceptance.py --center-root center --project-root . --output "${RUNNER_TEMP}/K01_CENTER_ACCEPTANCE_CURRENT.json"

      - name: Package guard
        run: |
          find center -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find center -type f -name '*.pyc' -delete
          python center/tools/package_guard.py

      - name: Upload generated acceptance
        uses: actions/upload-artifact@v4
        with:
          name: K01_CENTER_ACCEPTANCE_CURRENT
          path: ${{ runner.temp }}/K01_CENTER_ACCEPTANCE_CURRENT.json
