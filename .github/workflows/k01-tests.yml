name: K01 tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: K01 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: K01 governance regression
        run: python -m unittest discover -s tests/governance -p "test_*.py"

      - name: K01 assurance regression
        run: python -m unittest discover -s tests/assurance -p "test_*.py"

      - name: MEDTAS repository validation (machine-readable)
        run: python tools/medtas/ci_validate_repository_v2_2.py --repo-root . --json-only

      - name: MEDTAS technical-filter / structure / graph QA
        run: python tools/medtas/ci_validate_repository_v2_2.py --repo-root .
