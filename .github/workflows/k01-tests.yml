name: K01 tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: K01 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Run repository test suite
        run: pytest -q

      - name: Validate JSON schemas
        run: python tools/validate_schemas.py

      - name: Validate requirement-to-gate links
        run: python tools/check_requirement_links.py

      - name: Block engineering values in UI source
        run: python tools/check_ui_engineering_literals.py
