name: K01 Control CI

on:
  push:
    paths:
      - 'control/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/k01-control-ci.yml'
  pull_request:
    paths:
      - 'control/**'
      - 'tools/**'
      - 'tests/**'

jobs:
  control-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install jsonschema

      - name: Validate JSON Schemas
        run: python tools/validate_schemas.py

      - name: Validate requirement-to-gate links
        run: python tools/check_requirement_links.py

      - name: Block engineering values in UI source
        run: python tools/check_ui_engineering_literals.py

      - name: Run reducer tests
        shell: pwsh
        run: ./tests/run_reducer_tests.ps1
